name: Voice Pipeline Quality Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/openai_pipeline.py"
      - "scripts/build_podcast.py"
      - "scripts/production_upgrade.py"
      - "scripts/audio_enhancements.py"
      - "scripts/test_audio_enhancements.py"
      - ".github/workflows/voice-quality-check.yml"

permissions:
  contents: read

concurrency:
  group: two-takes-voice-quality
  cancel-in-progress: true

jobs:
  syntax-and-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lightweight audio-test dependency
        run: python -m pip install numpy

      - name: Compile voice and production pipeline
        run: |
          set -euo pipefail
          python -m py_compile scripts/openai_pipeline.py scripts/build_podcast.py scripts/production_upgrade.py scripts/audio_enhancements.py scripts/test_audio_enhancements.py

      - name: Test original music bed and chapter generation
        run: python -m unittest scripts.test_audio_enhancements

      - name: Check expressive voice features
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("scripts/openai_pipeline.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(path))

          functions = {
              node.name
              for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          required_functions = {"delivery_speed", "kokoro_segment", "split_for_kokoro", "tts"}
          missing = sorted(required_functions - functions)
          if missing:
              raise SystemExit("Missing voice pipeline functions: " + ", ".join(missing))

          required_features = [
              'KOKORO_HIMEL_VOICE = "am_eric"',
              'KOKORO_NIHA_VOICE = "af_bella"',
              '"delivery": delivery',
              'next_turn_index != turn_index',
              '"amused"',
              '"curious"',
              '"thoughtful"',
              '"playful"',
          ]
          for feature in required_features:
              if feature not in source:
                  raise SystemExit("Missing expected expressive voice feature: " + feature)

          print("Voice pipeline syntax and expressive pacing checks passed.")

          production = Path("scripts/production_upgrade.py").read_text(encoding="utf-8")
          builder = Path("scripts/build_podcast.py").read_text(encoding="utf-8")
          pipeline = Path("scripts/openai_pipeline.py").read_text(encoding="utf-8")
          production_features = [
              "def render_shorts(",
              "1080:1920",
              "sidechaincompress",
              "shorts_manifest.json",
              "FULL EPISODE ON CHANNEL",
          ]
          for feature in production_features:
              if feature not in production:
                  raise SystemExit("Missing vertical Shorts feature: " + feature)
          if 'shorts_renderer = globals().get("render_shorts")' not in builder:
              raise SystemExit("The episode builder is not wired to render Shorts.")
          if '"rendered_shorts": rendered_shorts' not in builder:
              raise SystemExit("The growth pack does not include rendered Shorts.")
          if "app.render_shorts = visual_upgrade.render_shorts" not in pipeline:
              raise SystemExit("The main pipeline is not wired to the Shorts renderer.")

          print("Vertical Shorts, mixed music, captions, and growth-pack integration checks passed.")
          PY
