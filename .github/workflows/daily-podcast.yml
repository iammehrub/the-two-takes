name: Two Takes — Daily Episode

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Optional trigger label
        required: false
        default: Manual
        type: string
  schedule:
    - cron: '0 2 * * *'
      timezone: "Asia/Dhaka"

permissions:
  contents: write

concurrency:
  group: two-takes-podcast-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick fonts-dejavu espeak-ng

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 "kokoro>=0.9.4" soundfile

      - name: Build and publish episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== PODCAST PREFLIGHT ==="
          python --version
          ls -la scripts
          python -c "from kokoro import KPipeline; print('Kokoro import OK')"
          python -m py_compile scripts/content_guard.py scripts/openai_pipeline.py scripts/build_podcast.py scripts/production_upgrade.py
          echo "=== PIPELINE PREFLIGHT PASSED ==="
          PYTHONPATH=scripts python -u scripts/openai_pipeline.py

      - name: Notify Discord and record upload
        env:
          DISCORD_YOUTUBE_PODCAST_WEBHOOK: ${{ secrets.DISCORD_YOUTUBE_PODCAST_WEBHOOK }}
          DISCORD_YOUTUBE_MENTION_ROLE_ID: ${{ secrets.DISCORD_YOUTUBE_MENTION_ROLE_ID }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          from discord_notify import notify_youtube

          info_path = Path("work/youtube_upload.json")
          if not info_path.exists():
              raise RuntimeError("Podcast upload metadata file was not created.")

          info = json.loads(info_path.read_text(encoding="utf-8"))
          notified = notify_youtube(info, "Podcast", "DISCORD_YOUTUBE_PODCAST_WEBHOOK")
          print("Podcast Discord notification:", "sent" if notified else "not sent; continuing")

          video_id = str(info.get("video_id", "")).strip()
          if not video_id:
              raise RuntimeError("Podcast upload metadata has no video_id.")

          record = {**info, "notified_at": datetime.now(timezone.utc).isoformat()}
          upload_dir = Path("data/youtube_uploads")
          upload_dir.mkdir(parents=True, exist_ok=True)
          (upload_dir / f"{video_id}.json").write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Upload recorded: {video_id}")
          PY

      - name: Persist upload record
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/content_history.json data/youtube_uploads/*.json

          if git diff --cached --quiet; then
            echo "No repository state changes to commit."
            exit 0
          fi

          git commit -m "Record podcast upload and content history"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            echo "Push attempt $attempt failed; syncing with origin/main..."
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              git pull --rebase origin main
            }
          done

          echo "Could not persist podcast upload record after 3 attempts."
          exit 1

      - name: Save growth assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-takes-growth-pack
          path: |
            work/growth_pack.json
            work/growth_pack.txt
            work/thumbnail.jpg
            work/script.txt
            work/youtube_metadata.json
            work/title_options.json
            work/thumbnail_text.txt
          if-no-files-found: ignore
          retention-days: 14
