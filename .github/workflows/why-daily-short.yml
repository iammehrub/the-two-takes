name: WHY — Daily Short

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: two-takes-content-writes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout credential host repo
        uses: actions/checkout@v5

      - name: Checkout WHY generator
        uses: actions/checkout@v5
        with:
          repository: iammehrub/Why-
          path: why-source

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Generate and publish WHY Short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cd why-source
          python scripts/short.py

      - name: Notify Discord and record Shorts upload
        env:
          DISCORD_YOUTUBE_SHORTS_WEBHOOK: ${{ secrets.DISCORD_YOUTUBE_SHORTS_WEBHOOK }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from discord_notify import notify_youtube

          info_path = Path("why-source/work/youtube_upload.json")
          if not info_path.exists():
              raise RuntimeError("WHY Short upload metadata file was not created.")
          info = json.loads(info_path.read_text(encoding="utf-8"))

          if not notify_youtube(info, "Shorts", "DISCORD_YOUTUBE_SHORTS_WEBHOOK"):
              raise RuntimeError("Shorts Discord notification failed.")

          state_path = Path("data/youtube_state.json")
          state = {"seen_video_ids": [], "notified_videos": []}
          if state_path.exists():
              try:
                  state = json.loads(state_path.read_text(encoding="utf-8"))
              except Exception:
                  pass
          state.setdefault("seen_video_ids", [])
          state.setdefault("notified_videos", [])
          vid = str(info.get("video_id", "")).strip()
          if not vid:
              raise RuntimeError("Shorts upload metadata has no video_id.")
          if vid not in state["seen_video_ids"]:
              state["seen_video_ids"].append(vid)
          from datetime import datetime, timezone
          state["notified_videos"].append({**info, "notified_at": datetime.now(timezone.utc).isoformat()})
          state["notified_videos"] = state["notified_videos"][-300:]
          state["seen_video_ids"] = state["seen_video_ids"][-300:]
          state["initialized"] = True
          state_path.parent.mkdir(parents=True, exist_ok=True)
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Discord notified and upload recorded: {vid}")
          PY

      - name: Save WHY artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: why-daily-short
          path: why-source/work/
          if-no-files-found: ignore
          retention-days: 7
