name: The Two Takes — Daily Episode

on:
  push:
    branches:
      - automation-live-test-podcast
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Optional trigger label
        required: false
        default: Activepieces
        type: string
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

concurrency:
  group: two-takes-content-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick fonts-dejavu espeak-ng

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 "kokoro>=0.9.4" soundfile

      - name: Build and publish episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "=== PODCAST DEBUG START ==="
          pwd
          echo "=== SCRIPTS DIRECTORY ==="
          ls -la scripts
          echo "=== PYTHON VERSION ==="
          python --version
          echo "=== KOKORO CHECK ==="
          python -c "from kokoro import KPipeline; print('Kokoro import OK')"
          echo "=== RUNNING OPENAI + KOKORO PODCAST RUNNER ==="
          PYTHONPATH=scripts python -u scripts/openai_pipeline.py
          echo "=== PODCAST BUILDER FINISHED ==="

      - name: Notify Discord and record upload
        env:
          DISCORD_YOUTUBE_PODCAST_WEBHOOK: ${{ secrets.DISCORD_YOUTUBE_PODCAST_WEBHOOK }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from discord_notify import notify_youtube

          info_path = Path("work/youtube_upload.json")
          if not info_path.exists():
              raise RuntimeError("Podcast upload metadata file was not created.")
          info = json.loads(info_path.read_text(encoding="utf-8"))

          notified = notify_youtube(info, "Podcast", "DISCORD_YOUTUBE_PODCAST_WEBHOOK")
          print("Podcast Discord notification:", "sent" if notified else "not sent; continuing")

          state_path = Path("data/youtube_state.json")
          state = {"seen_video_ids": [], "notified_videos": []}
          if state_path.exists():
              try:
                  state = json.loads(state_path.read_text(encoding="utf-8"))
              except Exception:
                  pass
          state.setdefault("seen_video_ids", [])
          state.setdefault("notified_videos", [])
          vid = str(info.get("video_id", "")).strip()
          if not vid:
              raise RuntimeError("Podcast upload metadata has no video_id.")
          if vid not in state["seen_video_ids"]:
              state["seen_video_ids"].append(vid)
          state["notified_videos"].append({**info, "notified_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat()})
          state["notified_videos"] = state["notified_videos"][-300:]
          state["seen_video_ids"] = state["seen_video_ids"][-300:]
          state["initialized"] = True
          state_path.parent.mkdir(parents=True, exist_ok=True)
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Discord notified and upload recorded: {vid}")
          PY

      - name: Save growth assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-two-takes-growth-pack
          path: |
            work/growth_pack.json
            work/growth_pack.txt
            work/thumbnail.jpg
            work/script.txt
          if-no-files-found: ignore
          retention-days: 14

