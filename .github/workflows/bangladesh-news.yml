name: Bangladesh Top 5 Discord News

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"
      timezone: "Asia/Dhaka"

permissions:
  contents: write

concurrency:
  group: two-takes-bd-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Send Bangladesh Top 5
        env:
          DISCORD_BD_NEWS_WEBHOOK: ${{ secrets.DISCORD_BD_NEWS_WEBHOOK }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
        run: python -u bangladesh_news.py
      - name: Save news state
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bangladesh_news_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Bangladesh news state"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              git pull --rebase origin main
            }
          done
          echo "Could not persist Bangladesh news state after 3 attempts."
          exit 1
