name: Two Takes — Automation Health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
      timezone: "Asia/Dhaka"

permissions:
  contents: read

concurrency:
  group: two-takes-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate automation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import py_compile
          import sys

          root = pathlib.Path(".")
          required = [
              ".github/workflows/daily-podcast.yml",
              ".github/workflows/youtube-analytics.yml",
              ".github/workflows/bangladesh-news.yml",
              ".github/workflows/failure-alerts.yml",
              "scripts/openai_pipeline.py",
              "scripts/content_guard.py",
              "business-service/generate_demo.py",
              "business-service/client_profile.example.json",
          ]
          missing = [p for p in required if not (root / p).exists()]
          if missing:
              raise SystemExit("Missing critical automation files: " + ", ".join(missing))

          py_files = list((root / "scripts").rglob("*.py"))
          py_files += list((root / "business-service").rglob("*.py"))
          failures = []
          for path in py_files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
          if failures:
              raise SystemExit("Python compile failures:\n" + "\n".join(failures))

          bad_json = []
          data = root / "data"
          if data.exists():
              for path in data.rglob("*.json"):
                  try:
                      json.loads(path.read_text(encoding="utf-8"))
                  except Exception as exc:
                      bad_json.append(f"{path}: {exc}")
          if bad_json:
              raise SystemExit("Invalid JSON state files:\n" + "\n".join(bad_json))

          history = data / "content_history.json"
          if history.exists():
              obj = json.loads(history.read_text(encoding="utf-8"))
              entries = obj if isinstance(obj, list) else obj.get("items", obj.get("history", []))
              if not isinstance(entries, list):
                  raise SystemExit("content_history.json has an unexpected structure")
              print(f"Content history entries: {len(entries)}")

          profile = json.loads((root / "business-service/client_profile.example.json").read_text(encoding="utf-8"))
          if not isinstance(profile, dict):
              raise SystemExit("Business service example profile must be a JSON object")

          import subprocess
          import tempfile
          with tempfile.TemporaryDirectory() as temp_dir:
              subprocess.run(
                  [
                      sys.executable,
                      "business-service/generate_demo.py",
                      "--profile",
                      "business-service/client_profile.example.json",
                      "--output-dir",
                      temp_dir,
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              pack_path = pathlib.Path(temp_dir) / "content_pack.json"
              markdown_path = pathlib.Path(temp_dir) / "content_pack.md"
              if not pack_path.exists() or not markdown_path.exists():
                  raise SystemExit("Business service demo did not create both expected files")
              pack = json.loads(pack_path.read_text(encoding="utf-8"))
              items = pack.get("items", [])
              if len(items) != 7 or pack.get("published") is not False or pack.get("approval_required") is not True:
                  raise SystemExit("Business service demo safety/quality check failed")
              if any(item.get("status") != "DRAFT — HUMAN APPROVAL REQUIRED" for item in items):
                  raise SystemExit("Business service output is missing its approval status")

          print(f"Healthy: checked {len(py_files)} Python files, JSON state, and 7-item approval-only demo.")
          PY
