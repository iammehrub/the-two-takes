name: Deploy My Daily HQ

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/pages-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate dashboard HTML and JavaScript
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          page = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", page, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected exactly one inline script; found {len(scripts)}")
          required_ids = [
              'id="repoPanel"', 'id="workflowPanel"', 'id="videoPanel"',
              'id="ytViews"', 'id="repoGrid"', 'id="workflowList"', 'id="videoList"'
          ]
          missing = [item for item in required_ids if item not in page]
          if missing:
              raise SystemExit("Dashboard is missing required UI elements: " + ", ".join(missing))
          Path("/tmp/my-daily-hq.js").write_text(scripts[0], encoding="utf-8")
          print(f"Found {len(scripts[0])} characters of JavaScript and all required dashboard panels.")
          PY
          node --check /tmp/my-daily-hq.js

      - name: Prepare static dashboard site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
