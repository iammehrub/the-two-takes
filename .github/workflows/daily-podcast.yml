name: The Two Takes — Daily Episode

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Optional trigger label
        required: false
        default: Activepieces
        type: string
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick fonts-dejavu espeak-ng

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 "kokoro>=0.9.4" soundfile

      - name: Build and publish episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "=== PODCAST DEBUG START ==="
          pwd
          echo "=== SCRIPTS DIRECTORY ==="
          ls -la scripts
          echo "=== PYTHON VERSION ==="
          python --version
          echo "=== KOKORO CHECK ==="
          python -c "from kokoro import KPipeline; print('Kokoro import OK')"
          echo "=== RUNNING OPENAI + KOKORO PODCAST RUNNER ==="
          PYTHONPATH=scripts python -u scripts/openai_pipeline.py
          echo "=== PODCAST BUILDER FINISHED ==="

      - name: Save growth assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-two-takes-growth-pack
          path: |
            work/growth_pack.json
            work/growth_pack.txt
            work/thumbnail.jpg
            work/script.txt
          if-no-files-found: ignore
          retention-days: 14
