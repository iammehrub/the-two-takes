name: Discord News and YouTube Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Test Discord
        env:
          DISCORD_BD_NEWS_WEBHOOK: ${{ secrets.DISCORD_BD_NEWS_WEBHOOK }}
          DISCORD_YOUTUBE_PODCAST_WEBHOOK: ${{ secrets.DISCORD_YOUTUBE_PODCAST_WEBHOOK }}
          DISCORD_YOUTUBE_SHORTS_WEBHOOK: ${{ secrets.DISCORD_YOUTUBE_SHORTS_WEBHOOK }}
          DISCORD_YOUTUBE_ANALYTICS_WEBHOOK: ${{ secrets.DISCORD_YOUTUBE_ANALYTICS_WEBHOOK }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          from discord_notify import send_webhook

          tests = [
              ("DISCORD_BD_NEWS_WEBHOOK", "🔴・bangladesh-news"),
              ("DISCORD_YOUTUBE_PODCAST_WEBHOOK", "🎙️・two-takes-podcast"),
              ("DISCORD_YOUTUBE_SHORTS_WEBHOOK", "📱・two-takes-shorts"),
              ("DISCORD_YOUTUBE_ANALYTICS_WEBHOOK", "📊・youtube-analytics"),
              ("DISCORD_ALERTS_WEBHOOK", "🚨・system-alerts"),
          ]
          failed = 0
          for env_name, channel in tests:
              ok = send_webhook(env_name, "✅ Connection Test", f"{channel} webhook is working.", fields=[("Channel", channel, True)])
              print(("PASS " if ok else "FAIL ") + channel)
              failed += 0 if ok else 1
          if failed:
              raise SystemExit(f"{failed} Discord test(s) failed.")
          PY
