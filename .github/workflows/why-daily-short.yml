name: WHY — Daily Short

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: two-takes-short-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout credential host repo
        uses: actions/checkout@v5

      - name: Checkout WHY generator
        uses: actions/checkout@v5
        with:
          repository: iammehrub/Why-
          path: why-source

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Generate and publish WHY Short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cd why-source
          python scripts/short.py

      - name: Notify Discord and record Shorts upload
        env:
          DISCORD_YOUTUBE_SHORTS_WEBHOOK: ${{ secrets.DISCORD_YOUTUBE_SHORTS_WEBHOOK }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from discord_notify import notify_youtube

          info_path = Path("why-source/work/youtube_upload.json")
          if not info_path.exists():
              raise RuntimeError("WHY Short upload metadata file was not created.")
          info = json.loads(info_path.read_text(encoding="utf-8"))

          notified = notify_youtube(info, "Shorts", "DISCORD_YOUTUBE_SHORTS_WEBHOOK")
          print("Shorts Discord notification:", "sent" if notified else "not sent; continuing")

          vid = str(info.get("video_id", "")).strip()
          if not vid:
              raise RuntimeError("Shorts upload metadata has no video_id.")

          from datetime import datetime, timezone
          record = {**info, "notified_at": datetime.now(timezone.utc).isoformat()}
          upload_dir = Path("data/youtube_uploads")
          upload_dir.mkdir(parents=True, exist_ok=True)
          record_path = upload_dir / f"{vid}.json"
          record_path.write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"Discord notified and upload recorded: {vid}")

      - name: Persist upload record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube_uploads/*.json
          git commit -m "Record Shorts upload"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing onto latest main..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Could not persist Shorts upload record after 3 attempts."
          exit 1


      - name: Save WHY artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: why-daily-short
          path: why-source/work/
          if-no-files-found: ignore
          retention-days: 7
