name: Notion Command Center Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
      timezone: "Asia/Dhaka"

permissions:
  actions: read
  contents: read

concurrency:
  group: notion-command-center-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check whether Notion is configured
        id: configuration
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [[ -z "$NOTION_TOKEN" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NOTION_TOKEN is missing. Monitoring is not active; see DASHBOARD_SETUP.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the existing Notion status block
        if: steps.configuration.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: "4026d90fa42981199432cc6e5e693bcf"
        run: python3 scripts/update_notion_command_center.py

      - name: Report skipped configuration
        if: steps.configuration.outputs.configured != 'true'
        run: echo "Skipped Notion update because NOTION_TOKEN has not been configured. No Notion data was changed."
