name: The Two Takes — Daily Episode

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Optional trigger label'
        required: false
        default: 'Activepieces'
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick fonts-dejavu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

          - name: Build and publish episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "=== PODCAST DEBUG START ==="
          echo "Current directory:"
          pwd

          echo "=== ROOT FILES ==="
          ls -la

          echo "=== SCRIPTS DIRECTORY ==="
          ls -la scripts

          echo "=== BUILD SCRIPT CHECK ==="
          ls -lh scripts/build_podcast.py
          echo "Lines in build_podcast.py:"
          wc -l scripts/build_podcast.py

          echo "=== PYTHON VERSION ==="
          python --version

          echo "=== RUNNING PODCAST BUILDER ==="
          python -u scripts/build_podcast.py

          echo "=== PODCAST BUILDER FINISHED ==="
