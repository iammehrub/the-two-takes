name: Two Takes — Daily Episode

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Optional trigger label
        required: false
        default: Manual
        type: string
  schedule:
    # GitHub Actions schedule cron is UTC: 02:07 UTC = 08:07 Bangladesh time;
    # 03:17 UTC = 09:17 Bangladesh time is a recovery trigger. The publish_guard
    # below prevents a second upload if the first run already succeeded.
    - cron: '7 2 * * *'
    - cron: '17 3 * * *'

permissions:
  actions: read
  contents: write

concurrency:
  group: two-takes-podcast-publish
  cancel-in-progress: false

jobs:
  publish_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Prevent duplicate same-day publishing
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily-podcast.yml/runs?per_page=100")"
          export RUNS_JSON="$runs_json"
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo

          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          today = datetime.now(ZoneInfo("Asia/Dhaka")).date()
          repo = os.environ["GITHUB_REPOSITORY"]
          runs = json.loads(os.environ["RUNS_JSON"]).get("workflow_runs", [])

          def stop(reason):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("should_run=false" + chr(10))
              print("Publishing skipped safely: " + reason)

          todays = []
          for run in runs:
              if int(run.get("id", 0)) == current_run_id:
                  continue
              created = run.get("created_at")
              if not created:
                  continue
              local_date = datetime.fromisoformat(created.replace("Z", "+00:00")).astimezone(
                  ZoneInfo("Asia/Dhaka")
              ).date()
              if local_date == today:
                  todays.append(run)

          todays.sort(key=lambda item: item.get("created_at", ""), reverse=True)
          for previous in todays:
              run_id = int(previous["id"])
              status = previous.get("status")
              conclusion = previous.get("conclusion")
              if status in {"queued", "in_progress", "waiting", "pending"}:
                  stop(f"daily run {run_id} is still {status}; avoiding overlapping publication.")
                  raise SystemExit(0)
              if conclusion == "success":
                  stop(f"daily run {run_id} already completed successfully today.")
                  raise SystemExit(0)
              if conclusion == "failure":
                  # A failed run may still have uploaded a public video. Inspect its full log before retrying.
                  try:
                      logs = subprocess.run(
                          ["gh", "run", "view", str(run_id), "--repo", repo, "--log"],
                          check=False, capture_output=True, text=True, timeout=90,
                      )
                  except Exception as exc:
                      stop(f"could not safely inspect failed run {run_id} ({exc}); avoiding a possible duplicate.")
                      raise SystemExit(0)
                  if logs.returncode != 0:
                      stop(f"GitHub could not provide logs for failed run {run_id}; avoiding a possible duplicate.")
                      raise SystemExit(0)
                  if "YouTube upload complete. Video ID:" in logs.stdout:
                      stop(f"failed run {run_id} already uploaded a video; automatic duplicate is blocked.")
                      raise SystemExit(0)
                  print(f"Previous run {run_id} failed before the confirmed-upload marker; a recovery attempt is allowed.")
                  break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("should_run=true" + chr(10))
          print(f"Publishing guard passed for Bangladesh date {today.isoformat()}.")
          PY

  build:
    needs: publish_guard
    if: needs.publish_guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system packages
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg imagemagick fonts-dejavu espeak-ng; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "System package installation failed after 3 attempts."
              exit 1
            fi
            echo "System package installation failed; retrying..."
            sleep $((attempt * 5))
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python packages
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --upgrade pip && python -m pip install -r requirements-podcast.txt; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "Python package installation failed after 3 attempts."
              exit 1
            fi
            echo "Python package installation failed; retrying..."
            sleep $((attempt * 5))
          done

      - name: Verify Kokoro English processing stack
        run: |
          set -euo pipefail
          python - <<'PY'
          import spacy
          import en_core_web_sm
          from kokoro import KPipeline

          if spacy.__version__ != "3.8.3":
              raise SystemExit(f"Expected spaCy 3.8.3, found {spacy.__version__}")
          if en_core_web_sm.__version__ != "3.8.0":
              raise SystemExit(f"Expected en_core_web_sm 3.8.0, found {en_core_web_sm.__version__}")

          nlp = spacy.load("en_core_web_sm")
          if not nlp("We are practising English conversation today."):
              raise SystemExit("The English NLP model returned no tokens.")

          # Exercise the exact constructor used by production, before OAuth/upload.
          pipeline = KPipeline(lang_code="a")
          if pipeline is None:
              raise SystemExit("Kokoro pipeline failed to initialize.")
          print("Kokoro preflight passed: pinned spaCy/model and KPipeline initialized.")
          PY

      - name: Verify YouTube upload OAuth
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/youtube_upload_preflight.py

      - name: Build and publish episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Gemini is the default; OpenAI is only used if this repository variable is explicitly set to true.
          USE_OPENAI_FOR_SCRIPT: ${{ vars.USE_OPENAI_FOR_SCRIPT }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Read-only token is used for optional public-demand research; upload still uses YOUTUBE_REFRESH_TOKEN.
          YOUTUBE_ANALYTICS_CLIENT_ID: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_ANALYTICS_CLIENT_SECRET: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== PODCAST PREFLIGHT ==="
          python --version
          ls -la scripts
          python -c "from kokoro import KPipeline; print('Kokoro import OK')"
          python -m py_compile scripts/content_guard.py scripts/openai_pipeline.py scripts/build_podcast.py scripts/production_upgrade.py scripts/audio_enhancements.py scripts/episode_qc.py
          echo "=== PIPELINE PREFLIGHT PASSED ==="
          PYTHONPATH=scripts python -u scripts/openai_pipeline.py

      - name: Validate upload metadata and record upload
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          info_path = Path("work/youtube_upload.json")
          if not info_path.exists():
              raise RuntimeError(
                  "YouTube upload metadata is missing. The build step did not "
                  "complete its upload-recording stage."
              )

          info = json.loads(info_path.read_text(encoding="utf-8"))
          if not isinstance(info, dict):
              raise RuntimeError("YouTube upload metadata is not a JSON object.")

          video_id = str(info.get("video_id", "")).strip()
          if not video_id:
              raise RuntimeError("YouTube upload metadata has no video_id.")

          record = {
              **info,
              "notified_at": datetime.now(timezone.utc).isoformat(),
          }
          upload_dir = Path("data/youtube_uploads")
          upload_dir.mkdir(parents=True, exist_ok=True)
          record_path = upload_dir / f"{video_id}.json"
          record_path.write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Verified and recorded YouTube upload: {video_id}")
          PY

      - name: Publish episode and matching Reel to Facebook
        if: success()
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_API_VERSION: ${{ vars.FACEBOOK_GRAPH_API_VERSION || 'v26.0' }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/facebook_publish.py
          python scripts/facebook_publish.py

      - name: Notify Discord about published episode
        env:
          DISCORD_YOUTUBE_PODCAST_WEBHOOK: ${{ secrets.DISCORD_YOUTUBE_PODCAST_WEBHOOK }}
          DISCORD_YOUTUBE_MENTION_ROLE_ID: ${{ secrets.DISCORD_YOUTUBE_MENTION_ROLE_ID }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from discord_notify import notify_youtube

          info_path = Path("work/youtube_upload.json")
          info = json.loads(info_path.read_text(encoding="utf-8"))
          sent = notify_youtube(
              info,
              "Podcast",
              "DISCORD_YOUTUBE_PODCAST_WEBHOOK",
          )
          print("Podcast Discord notification:", "sent" if sent else "not sent; continuing")
          PY

      - name: Persist upload record
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/content_history.json data/youtube_uploads/

          if git diff --cached --quiet; then
            echo "No repository state changes to commit."
            exit 0
          fi

          git commit -m "Record podcast upload and content history"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi

            echo "Push attempt $attempt failed; syncing with origin/main..."
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              git pull --rebase origin main
            }
          done

          echo "Could not persist podcast upload record after 5 attempts."
          exit 1

      - name: Save growth assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-takes-growth-pack
          path: |
            work/growth_pack.json
            work/growth_pack.txt
            work/thumbnail.jpg
            work/script.txt
            work/youtube_metadata.json
            work/title_options.json
            work/thumbnail_text.txt
            work/chapters.txt
            work/original_music_bed.wav
            work/shorts/
            work/youtube_shorts.json
            work/production_report.json
            work/production_report.txt
            work/captions.srt
            work/captions.ass
            work/facebook_publish.json
          if-no-files-found: ignore
          retention-days: 14
