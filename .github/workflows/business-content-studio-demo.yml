name: Business Content Studio — Demo Pack

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Optional plan start date (YYYY-MM-DD)
        required: false
        type: string
      writing_mode:
        description: Use templates (always free) or try the optional free AI router
        required: true
        default: template
        type: choice
        options:
          - template
          - auto

permissions:
  contents: read

concurrency:
  group: business-content-studio-demo
  cancel-in-progress: false

jobs:
  generate-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s business-service -p 'test_*.py' -v

      - name: Validate generator
        run: python -m py_compile business-service/generate_demo.py

      - name: Generate approval-only demo
        shell: bash
        env:
          PLAN_START_DATE: ${{ inputs.start_date }}
          WRITING_MODE: ${{ inputs.writing_mode }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          args=(--mode "$WRITING_MODE")
          if [[ -n "$PLAN_START_DATE" ]]; then
            args+=(--start-date "$PLAN_START_DATE")
          fi
          python business-service/generate_demo.py "${args[@]}"

      - name: Upload draft pack
        uses: actions/upload-artifact@v6
        with:
          name: business-content-studio-demo
          path: work/business_service_demo/
          if-no-files-found: error
          retention-days: 7
