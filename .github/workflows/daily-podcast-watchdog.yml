name: Daily Podcast Schedule Watchdog

on:
  schedule:
    # Explicit Dhaka-time recovery checks, staggered after the primary schedule.
    # The primary schedule runs at 08:17, 08:47, 09:17, and 09:47 Asia/Dhaka.
    - cron: '32 8 * * *'
      timezone: "Asia/Dhaka"
    - cron: '2 9 * * *'
      timezone: "Asia/Dhaka"
    - cron: '32 9 * * *'
      timezone: "Asia/Dhaka"
    - cron: '2 10 * * *'
      timezone: "Asia/Dhaka"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: two-takes-podcast-schedule-watchdog
  cancel-in-progress: false

jobs:
  verify-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check today's run and safely recover if needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          now = datetime.now(timezone.utc)
          today = now.astimezone(ZoneInfo("Asia/Dhaka")).date()
          endpoint = f"repos/{repo}/actions/workflows/daily-podcast.yml/runs?per_page=100"
          result = subprocess.run(
              ["gh", "api", endpoint],
              check=True, capture_output=True, text=True,
              env={**os.environ, "GH_TOKEN": token},
          )
          runs = json.loads(result.stdout).get("workflow_runs", [])
          today_runs = []
          for run in runs:
              created = run.get("created_at")
              if not created:
                  continue
              created_at = datetime.fromisoformat(created.replace("Z", "+00:00"))
              if created_at.astimezone(ZoneInfo("Asia/Dhaka")).date() == today:
                  run["_created_at"] = created_at
                  today_runs.append(run)

          today_runs.sort(key=lambda r: r["_created_at"], reverse=True)

          active = next(
              (r for r in today_runs if r.get("status") in {"queued", "in_progress", "waiting", "pending"}),
              None,
          )
          successful = None
          for run in today_runs:
              if run.get("conclusion") != "success":
                  continue
              jobs_result = subprocess.run(
                  ["gh", "api", f"repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100"],
                  check=False, capture_output=True, text=True,
                  env={**os.environ, "GH_TOKEN": token},
              )
              if jobs_result.returncode != 0:
                  raise SystemExit(
                      f"Could not verify build job for run {run['id']}; "
                      "stopping recovery to avoid a duplicate upload."
                  )
              jobs = json.loads(jobs_result.stdout).get("jobs", [])
              build_job = next((job for job in jobs if job.get("name") == "build"), None)
              if build_job and build_job.get("conclusion") == "success":
                  successful = run
                  break
              print(
                  f"Run {run['id']} was overall-successful, but its build job "
                  f"was {build_job.get('conclusion') if build_job else 'not created'}; "
                  "it did not publish an episode."
              )

          if active:
              print(
                  f"No recovery needed: run {active['id']} is active "
                  f"(status={active.get('status')})."
              )
              raise SystemExit(0)

          if successful:
              print(
                  f"No recovery needed: build job in run {successful['id']} "
                  f"succeeded today (created_at={successful.get('created_at')})."
              )
              raise SystemExit(0)

          latest = today_runs[0] if today_runs else None
          if latest:
              age_minutes = (now - latest["_created_at"]).total_seconds() / 60
              if age_minutes < 20:
                  print(
                      f"Latest run {latest['id']} ended without success "
                      f"(conclusion={latest.get('conclusion')}); waiting for the next check "
                      f"to avoid rapid repeated retries ({age_minutes:.1f} minutes old)."
                  )
                  raise SystemExit(0)

          reason = (
              f"latest run {latest['id']} is not successful (conclusion={latest.get('conclusion')})"
              if latest else f"no daily-podcast run found for Bangladesh date {today}"
          )
          print(f"Recovery needed: {reason}. Dispatching workflow_dispatch.")
          dispatch = subprocess.run(
              [
                  "gh", "api", "--method", "POST",
                  f"repos/{repo}/actions/workflows/daily-podcast.yml/dispatches",
                  "-f", "ref=main",
                  "-f", "inputs[trigger_source]=Schedule watchdog recovery",
              ],
              check=False, capture_output=True, text=True,
              env={**os.environ, "GH_TOKEN": token},
          )
          if dispatch.returncode != 0:
              print(dispatch.stderr or dispatch.stdout)
              raise SystemExit(
                  "Recovery dispatch failed. Check repository Actions permissions and this job's logs."
              )
          print("Recovery dispatch accepted by GitHub.")
          PY
