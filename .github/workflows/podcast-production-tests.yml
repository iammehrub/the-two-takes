name: Podcast Production Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/openai_pipeline.py"
      - "scripts/build_podcast.py"
      - "scripts/production_upgrade.py"
      - "scripts/audio_enhancements.py"
      - "scripts/episode_qc.py"
      - ".github/workflows/daily-podcast.yml"
      - ".github/workflows/podcast-production-tests.yml"
      - "assets/two_takes_podcast_studio.avif"

permissions:
  contents: read

concurrency:
  group: two-takes-production-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install free local test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install numpy requests
      - name: Compile production modules
        run: |
          set -euo pipefail
          python -m py_compile scripts/content_guard.py scripts/openai_pipeline.py scripts/build_podcast.py scripts/production_upgrade.py scripts/audio_enhancements.py scripts/episode_qc.py
      - name: Validate branded artwork exports
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          asset = Path("assets/two_takes_podcast_studio.avif")
          if not asset.is_file() or asset.stat().st_size < 1000:
              raise SystemExit("Branded studio artwork is missing or unexpectedly small.")

          outputs = [
              (1280, 720, Path("work/ci-thumbnail-poster.png")),
              (1920, 1080, Path("work/ci-video-opener.png")),
          ]
          for width, height, output in outputs:
              output.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(
                  [
                      "ffmpeg", "-v", "error", "-y", "-i", str(asset),
                      "-vf", f"scale={width}:{height}:flags=lanczos",
                      "-frames:v", "1", "-update", "1", str(output),
                  ],
                  check=True,
              )
              result = subprocess.run(
                  [
                      "ffprobe", "-v", "error", "-select_streams", "v:0",
                      "-show_entries", "stream=width,height", "-of", "json",
                      str(output),
                  ],
                  check=True, capture_output=True, text=True,
              )
              streams = json.loads(result.stdout).get("streams", [])
              if not streams or streams[0].get("width") != width or streams[0].get("height") != height:
                  raise SystemExit(
                      f"Branded artwork export has the wrong dimensions: {output}"
                  )
              print(f"Branded artwork OK: {output} ({width}x{height})")
          PY

      - name: Test full-video opener and speaker-positioned subtitles
        env:
          PYTHONPATH: scripts
          GEMINI_API_KEY: test-only-no-network
          YOUTUBE_CLIENT_ID: test-only-no-network
          YOUTUBE_CLIENT_SECRET: test-only-no-network
          YOUTUBE_REFRESH_TOKEN: test-only-no-network
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          import build_podcast as app
          import production_upgrade

          work = Path(app.WORK)
          work.mkdir(parents=True, exist_ok=True)
          voice = work / "fixed-opener-test.wav"
          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-f", "lavfi", "-i", "sine=frequency=440:sample_rate=24000:duration=15",
              "-ac", "2", "-c:a", "pcm_s16le", str(voice),
          ], check=True)

          timing = []
          for i in range(12):
              speaker = "Himel" if i % 2 == 0 else "Niha"
              start = i * 0.62
              timing.append({
                  "speaker": speaker,
                  "text": (
                      "This is a clear English dialogue caption for testing."
                      if speaker == "Himel"
                      else "Here is the response from the other host."
                  ),
                  "start": start,
                  "end": start + 0.55,
                  "turn_index": i,
                  "turn_type": "hook" if i == 0 else ("language_tip" if i == 4 else ("practice" if i == 8 else "reaction")),
              })
          (work / "tts_segments.json").write_text(
              json.dumps(timing, indent=2), encoding="utf-8"
          )
          srt = production_upgrade.make_srt("", 15.0)
          ass = work / "captions.ass"
          ass_text = ass.read_text(encoding="utf-8")
          assert "HIMEL" in ass_text and "NIHA" in ass_text
          assert r"\pos(470,775)" in ass_text, "Himel captions are not anchored under the left host."
          assert r"\pos(1450,775)" in ass_text, "Niha captions are not anchored under the right host."
          assert srt.exists() and "00:00:00,000" in srt.read_text(encoding="utf-8")

          result_video = production_upgrade.render_video(voice, [], srt, "CI fixed opener test")
          probe = subprocess.run([
              "ffprobe", "-v", "error", "-select_streams", "v:0",
              "-show_entries", "stream=width,height,codec_name",
              "-show_entries", "format=duration", "-of", "json", str(result_video),
          ], check=True, capture_output=True, text=True)
          info = json.loads(probe.stdout)
          stream = info["streams"][0]
          assert stream["width"] == 1920 and stream["height"] == 1080, info
          assert stream["codec_name"] == "h264", info
          assert abs(float(info["format"]["duration"]) - 15.0) < 1.0, info

          renderer = Path("scripts/production_upgrade.py").read_text(encoding="utf-8")
          generator = Path("scripts/openai_pipeline.py").read_text(encoding="utf-8")
          assert "enable='between(t,0,4)'" not in renderer
          assert "overlay=0:0" not in renderer
          assert "pause = 5.5" not in generator
          assert "5.5-second original instrumental sting" not in generator
          print("Fixed opener, no-intro timing, and left/right speaker subtitles passed.")
          PY
      - name: Smoke-test original music and chapter generation
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          mkdir -p work/smoke/repo/work
          python - <<'PY'
          import wave
          from pathlib import Path
          from audio_enhancements import generate_music_bed, build_chapters

          out = Path("work/smoke/repo/work/test_music.wav")
          generate_music_bed(18, out, sample_rate=24000)
          with wave.open(str(out), "rb") as audio:
              assert audio.getnchannels() == 2, "Music must be stereo"
              assert audio.getframerate() == 24000, "Unexpected sample rate"
              assert abs(audio.getnframes() / audio.getframerate() - 18) < 0.02

          chapters = build_chapters([
              {"turn_type": "hook", "start": 0},
              {"turn_type": "question", "start": 30},
              {"turn_type": "language_tip", "start": 120},
              {"turn_type": "practice", "start": 240},
              {"turn_type": "recap", "start": 540},
          ], 600)
          assert len(chapters) >= 3, f"Expected chapter markers, got {chapters}"
          assert chapters[0].startswith("00:00"), chapters
          print("Original music and chapter smoke tests passed.")
          PY
      - name: Smoke-test final media quality gate
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from episode_qc import create_report

          root = Path("work/smoke/repo")
          work = root / "work"
          work.mkdir(parents=True, exist_ok=True)
          voice = work / "voice.wav"
          video = work / "final.mp4"
          captions = work / "captions.srt"

          subprocess.run([
              "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
              "-f", "lavfi", "-i", "sine=frequency=440:sample_rate=24000:duration=15",
              "-ac", "2", "-c:a", "pcm_s16le", str(voice)
          ], check=True)
          subprocess.run([
              "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
              "-f", "lavfi", "-i", "color=c=black:s=1920x1080:r=5:d=15",
              "-f", "lavfi", "-i", "sine=frequency=440:sample_rate=24000:duration=15",
              "-vf", "format=yuv420p", "-c:v", "libx264", "-preset", "ultrafast",
              "-c:a", "aac", "-ac", "2", "-shortest", str(video)
          ], check=True)
          captions.write_text(
              "".join(f"{i}\n00:00:{i-1:02d},000 --> 00:00:{i:02d},500\nPractice this useful English phrase.\n\n" for i in range(1, 11)),
              encoding="utf-8",
          )
          (work / "chapters.txt").write_text(
              "00:00 Hook and today's question\n00:30 Real conversation and examples\n02:00 Useful phrases explained\n04:00 Speaking practice\n09:00 Review and next step\n",
              encoding="utf-8",
          )
          (work / "youtube_metadata.json").write_text(json.dumps({"title":"Smoke test"}), encoding="utf-8")
          phrase = "This is a short synthetic test sentence for verifying media timing, clear audio, balanced hosts, and readable captions."
          script = "\n".join(("Himel: " if i % 2 == 0 else "Niha: ") + phrase for i in range(120))
          report = create_report(root, script, voice, video, captions)
          assert report["status"] != "failed", report
          assert report["audio_video_duration_difference_seconds"] <= 2.5, report
          assert report["subtitle_cues"] == 10, report
          print("Final media quality gate smoke test passed.")
          PY

      - name: Smoke-test vertical Shorts rendering
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          # Importing the existing builder checks its configuration at startup.
          # Dummy values are safe here: no API calls or uploads occur in this test.
          os.environ.setdefault("GEMINI_API_KEY", "test-only-no-network")
          os.environ.setdefault("PEXELS_API_KEY", "test-only-no-network")
          os.environ.setdefault("YOUTUBE_CLIENT_ID", "test-only-no-network")
          os.environ.setdefault("YOUTUBE_CLIENT_SECRET", "test-only-no-network")
          os.environ.setdefault("YOUTUBE_REFRESH_TOKEN", "test-only-no-network")

          from audio_enhancements import generate_music_bed, select_short_windows
          import production_upgrade

          work = Path("work")
          work.mkdir(parents=True, exist_ok=True)
          base = work / "base_video.mp4"
          voice = work / "shorts_smoke_voice.wav"
          music = work / "original_music_bed.wav"
          timing_path = work / "tts_segments.json"

          subprocess.run([
              "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
              "-f", "lavfi", "-i", "color=c=0x3b2b22:s=640x360:r=8:d=120",
              "-an", "-c:v", "libx264", "-preset", "ultrafast",
              "-pix_fmt", "yuv420p", str(base)
          ], check=True)
          subprocess.run([
              "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
              "-f", "lavfi", "-i", "sine=frequency=440:sample_rate=24000:duration=120",
              "-ac", "1", "-c:a", "pcm_s16le", str(voice)
          ], check=True)
          generate_music_bed(120, music, sample_rate=24000)

          timing = []
          beat_types = {0: "hook", 20: "language_tip", 40: "practice"}
          for i in range(60):
              start = float(i * 2)
              timing.append({
                  "speaker": "Himel" if i % 2 == 0 else "Niha",
                  "text": f"Practice this useful English phrase number {i}.",
                  "start": start,
                  "end": start + 2.0,
                  "turn_index": i,
                  "turn_type": beat_types.get(i, "reaction"),
              })
          timing_path.write_text(json.dumps(timing, indent=2), encoding="utf-8")

          # Keep CI fast: the real workflow uses 30 fps / ~30s clips.
          # This smoke test exercises the same renderer with 8 fps / 18s clips.
          production_upgrade.FPS = 8
          production_upgrade.select_short_windows = (
              lambda segments, duration_seconds, max_clips=3: select_short_windows(
                  segments,
                  duration_seconds,
                  max_clips=max_clips,
                  target_seconds=18.0,
                  min_seconds=18.0,
                  max_seconds=20.0,
                  min_gap_seconds=35.0,
              )
          )
          manifest = production_upgrade.render_shorts(
              voice, "A simple smoke test", "Everyday English"
          )
          assert len(manifest) == 3, f"Expected 3 Shorts, received {len(manifest)}"
          for item in manifest:
              output = work / "shorts" / item["file"]
              assert output.exists() and output.stat().st_size > 0, output
              probe = subprocess.run([
                  "ffprobe", "-v", "error", "-select_streams", "v:0",
                  "-show_entries", "stream=width,height", "-of", "json", str(output)
              ], capture_output=True, text=True, check=True)
              video = json.loads(probe.stdout)["streams"][0]
              assert (video["width"], video["height"]) == (1080, 1920), video

              probe = subprocess.run([
                  "ffprobe", "-v", "error", "-select_streams", "a:0",
                  "-show_entries", "stream=codec_name,channels", "-of", "json", str(output)
              ], capture_output=True, text=True, check=True)
              audio = json.loads(probe.stdout)["streams"][0]
              assert audio["codec_name"] == "aac" and audio["channels"] >= 2, audio

          print("Vertical Shorts render smoke test passed: 3 captioned 1080x1920 videos with AAC stereo audio.")
          PY
